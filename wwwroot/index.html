<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dealer School Trainer</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <!-- "Add to Home Screen" app mode: when the site is opened from its
         home-screen icon it runs without the browser's address bar and
         toolbar (more room for the games on phones). No offline mode /
         service worker, so published updates still show up normally. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f4f4f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dealer Trainer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Refreshed pages and shared links: GitHub Pages sends any address
         other than the home page to 404.html, which bounces back here as
         .../?/<page>. Put the real address back (before the trainer
         starts) so that page opens instead of the home page. -->
    <script>
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="DealerSchoolTrainerWeb.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Phones (mainly iPhone): stop a quick second tap from zooming the
         page (double-tap zoom), even where touch-action: manipulation in
         app.css isn't honored. A second tap within 300 ms has its zoom
         gesture cancelled; if it landed on something tappable (button,
         checkbox, wager shape, card), the tap is still delivered as a
         click, so fast tapping keeps working. Dropdowns, text boxes and
         pinch zoom are left alone. -->
    <script>
        (function () {
            var lastTouchEnd = 0;
            document.addEventListener('touchend', function (e) {
                var now = Date.now();
                var quick = now - lastTouchEnd <= 300;
                lastTouchEnd = now;
                if (!quick || e.touches.length > 0) return;
                var t = e.target;
                if (!t || !t.closest) return;
                if (t.closest('select, textarea, input[type=text], input[type=number]')) return;
                e.preventDefault();
                var tappable = t.closest('button, a, label, input[type=checkbox], input[type=radio], .wager-shape, .pai-gow-card, .menu-backdrop, .wp-backdrop');
                if (tappable && !tappable.disabled) tappable.click();
            }, { passive: false });
        })();
    </script>
    <!-- Wager pop-ups (Shared/WagerPick): after one opens, nudge it back
         inside the screen if its button sits near the left or right
         edge, and flip it above the button if it would run off the
         bottom. -->
    <script>
        window.dstClampPopup = function (el) {
            if (!el || !el.getBoundingClientRect) return;
            el.style.marginLeft = '0px';
            el.classList.remove('wp-pop-up');
            var r = el.getBoundingClientRect();
            var pad = 8, w = document.documentElement.clientWidth, h = window.innerHeight;
            var dx = 0;
            if (r.left < pad) dx = pad - r.left;
            else if (r.right > w - pad) dx = (w - pad) - r.right;
            el.style.marginLeft = dx + 'px';
            if (r.bottom > h - pad) el.classList.add('wp-pop-up');
        };
    </script>
    <!-- Card images: load all 53 once, as soon as the page has loaded, so
         a new hand's cards all appear at the same moment instead of one
         by one as each image downloads (noticeable in Challenge Mode).
         And if a card image ever fails to load, try it once more instead
         of leaving a blank card. -->
    <script>
        (function () {
            var codes = ['JOKER'];
            'A23456789TJQK'.split('').forEach(function (r) {
                'SHDC'.split('').forEach(function (s) { codes.push(r + s); });
            });

            window.dstCardImages = [];
            function preload() {
                codes.forEach(function (c) {
                    var img = new Image();
                    img.src = 'images/cards/' + c + '.png';
                    if (img.decode) img.decode().catch(function () { });
                    window.dstCardImages.push(img);
                });
            }
            if (document.readyState === 'complete') preload();
            else window.addEventListener('load', preload);

            document.addEventListener('error', function (e) {
                var img = e.target;
                if (!img || img.tagName !== 'IMG') return;
                var src = img.getAttribute('src') || '';
                if (src.indexOf('images/cards/') < 0 || img.dataset.dstRetried) return;
                img.dataset.dstRetried = '1';
                setTimeout(function () {
                    img.src = src.split('?')[0] + '?retry=' + Date.now();
                }, 300);
            }, true);
            document.addEventListener('load', function (e) {
                var img = e.target;
                if (img && img.tagName === 'IMG' && img.dataset.dstRetried) delete img.dataset.dstRetried;
            }, true);
        })();
    </script>
    <!-- Desktop number pad: true when this is a computer (mouse, wide
         window) and the window is tall enough to open the pad below the
         answer box without pushing the Submit / End bar off screen. The
         pad is about 250px tall (305 with Payouts' extra Enter row); the
         bar sits just under the game. -->
    <script>
        window.dstKeypadFits = function (padHeight) {
            if (!window.matchMedia('(min-width: 769px) and (pointer: fine)').matches) return false;
            var bar = document.querySelector('.game-bar');
            if (!bar) return false;
            return bar.getBoundingClientRect().bottom + (padHeight || 260) <= window.innerHeight;
        };
    </script>
    <!-- Scrolls a feedback block into view (Session Summary after End
         Session, Pai Gow's wager breakdown after Submit). Its CSS
         scroll-margin keeps it clear of the phone top bar. -->
    <script>
        window.dstScrollToEl = function (selector) {
            var el = document.querySelector(selector);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        // After Submit: scroll the feedback (result line + box) into view,
        // unless it's already fully on screen (e.g. on a tall desktop
        // window). 70px clears the phone top bar and the bottom bar.
        window.dstRevealFeedback = function () {
            var head = document.querySelector('.breakdown-result');
            if (!head) return;
            var box = head.nextElementSibling || head;
            var top = head.getBoundingClientRect().top;
            var bottom = box.getBoundingClientRect().bottom;
            if (top >= 70 && bottom <= window.innerHeight - 70) return;
            head.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
    </script>
    <!-- About page, "Reload Latest Version": GitHub Pages lets browsers
         reuse a saved copy of the page and stylesheet for 10 minutes.
         This fetches both fresh from GitHub (cache: 'reload' also replaces
         the saved copies), then restarts the trainer from its home page.
         Everything under _framework is renamed on each publish, so the new
         page always pulls the new game code. Saved scores are untouched. -->
    <script>
        window.dstReloadLatest = async function () {
            var base = document.baseURI;
            var urls = [base, base + 'index.html', base + 'css/app.css', base + 'manifest.webmanifest'];
            try {
                await Promise.all(urls.map(function (u) {
                    return fetch(u, { cache: 'reload' }).catch(function () { });
                }));
            } catch (e) { }
            location.replace(base);
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
