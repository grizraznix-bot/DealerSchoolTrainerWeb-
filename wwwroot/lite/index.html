<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Table Tools Lite</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Table Tools" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Table Tools Lite: the training-table tools for older iPads (e.g. an
         iPad Air 2 on iPadOS 15) that can't run the main trainer. Plain
         HTML / JavaScript, no .NET. Built for an iPad held sideways.
         It borrows the main site's styles (../css/app.css) so the tools
         look the same, and lite.css lays them out full screen.
         A change to a tool on the main site has to be repeated here
         (see PROJECT-NOTES.md). -->
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="lite.css" />
</head>

<body class="lite">
    <div id="lite-app"></div>
    <script src="../js/beep.js"></script>
    <script src="lite.js"></script>
</body>

</html>
